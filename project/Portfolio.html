<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Studio — Selected works</title>
<meta name="description" content="A minimalist portfolio. Selected works, writing and notes." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#F5F3EE;
    --ink:#1A1A1A;
    --mute:#6B6862;
    --line:rgba(26,26,26,.10);
    --line-soft:rgba(26,26,26,.06);
    --tile:#E8E4DB;
    --tile-2:#DDD7CA;
    --tile-3:#CFC8B7;
    --tile-4:#BAB1A0;
    --accent:#C9B89A;
    --shadow:0 1px 2px rgba(26,26,26,.04);
    --display:'Bricolage Grotesque','Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
    --body:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  html[data-theme="dark"]{
    --bg:#0F0F0E;
    --ink:#F0EEE8;
    --mute:#8C8A85;
    --line:rgba(240,238,232,.12);
    --line-soft:rgba(240,238,232,.06);
    --tile:#1A1A19;
    --tile-2:#222220;
    --tile-3:#2B2B28;
    --tile-4:#3A3935;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:var(--body);font-size:16px;line-height:1.55;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
    transition:background .35s ease, color .35s ease;}
  html{scroll-behavior:smooth}
  body{overflow-x:hidden}
  ::selection{background:var(--ink);color:var(--bg)}

  /* container */
  .wrap{width:100%;max-width:1440px;margin:0 auto;
    padding:0 clamp(20px,4vw,56px)}

  /* hide native cursor when custom cursor active */
  html[data-cursor="dot"], html[data-cursor="dot"] *{cursor:none !important}
  html[data-cursor="crosshair"], html[data-cursor="crosshair"] *{cursor:crosshair !important}

  /* Underline draw on links */
  .link-u{position:relative;text-decoration:none;color:inherit;display:inline-block}
  .link-u::after{content:"";position:absolute;left:0;right:0;bottom:-2px;
    height:1px;background:currentColor;transform:scaleX(0);
    transform-origin:right center;transition:transform .5s cubic-bezier(.7,0,.2,1)}
  .link-u:hover::after{transform:scaleX(1);transform-origin:left center}
  .link-u.always::after{transform:scaleX(1)}

  /* hairline */
  .hr{height:1px;background:var(--line);width:100%}

  /* typographic helpers */
  .mono{font-family:var(--mono);letter-spacing:.02em;font-size:11px;
    text-transform:uppercase;color:var(--mute)}
  .display{font-family:var(--display);font-weight:400;letter-spacing:-0.03em;
    line-height:.96}
  .serif-mode .display{font-family:var(--display)}

  /* status pulse */
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
    background:#3aa56b;margin-right:8px;vertical-align:middle;
    box-shadow:0 0 0 0 rgba(58,165,107,.55);
    animation:pulse 2.2s ease-out infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(58,165,107,.55)}
    70%{box-shadow:0 0 0 10px rgba(58,165,107,0)}
    100%{box-shadow:0 0 0 0 rgba(58,165,107,0)}
  }

  /* custom cursor */
  .cursor-dot{position:fixed;top:0;left:0;width:8px;height:8px;border-radius:50%;
    background:var(--ink);pointer-events:none;z-index:9998;
    transform:translate(-50%,-50%);mix-blend-mode:difference;
    transition:width .2s,height .2s,opacity .2s;opacity:1}
  .cursor-ring{position:fixed;top:0;left:0;width:32px;height:32px;border-radius:50%;
    border:1px solid var(--ink);pointer-events:none;z-index:9997;
    transform:translate(-50%,-50%);mix-blend-mode:difference;
    transition:width .25s cubic-bezier(.2,.7,.2,1),height .25s,opacity .25s;opacity:.7}
  .cursor-dot.hover{width:0;height:0}
  .cursor-ring.hover{width:64px;height:64px;opacity:.5}

  /* fade in on scroll */
  .reveal{opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}

  /* project marquee on hover */
  .marquee{display:inline-block;white-space:nowrap;overflow:hidden;max-width:100%;
    vertical-align:bottom}
  .marquee>span{display:inline-block;will-change:transform;
    transition:transform 18s linear}
  .marquee-on:hover .marquee>span{transform:translateX(calc(-50% - 12px))}

  /* image reveal */
  .tile{position:relative;overflow:hidden;background:var(--tile);
    border:.5px solid var(--line);border-radius:6px;isolation:isolate}
  .tile .veil{position:absolute;inset:0;background:var(--bg);
    transform-origin:right center;transform:scaleX(1);
    transition:transform 1.1s cubic-bezier(.76,0,.24,1)}
  .tile.in .veil{transform:scaleX(0)}
  .tile .num{position:absolute;font-family:var(--display);font-weight:300;
    letter-spacing:-.04em;line-height:.85;color:var(--ink);opacity:.92;
    mix-blend-mode:multiply}
  html[data-theme="dark"] .tile .num{mix-blend-mode:screen;opacity:.85}
  .tile .stripes{position:absolute;inset:0;
    background-image:repeating-linear-gradient(45deg,transparent 0 11px,var(--line-soft) 11px 12px)}
  .tile .meta{position:absolute;bottom:14px;left:16px;right:16px;
    display:flex;justify-content:space-between;gap:16px;font-family:var(--mono);
    font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--mute)}
  .tile .corner{position:absolute;top:14px;left:16px;font-family:var(--mono);
    font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
  .tile.hover-lift{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
  .tile.hover-lift:hover{transform:translateY(-4px)}

  /* small interaction targets */
  .chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;
    border:.5px solid var(--line);border-radius:999px;font-family:var(--mono);
    font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);
    background:transparent}

  /* nav */
  .nav{position:fixed;top:0;left:0;right:0;z-index:50;
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    background:color-mix(in oklab,var(--bg) 70%,transparent);
    border-bottom:.5px solid transparent;transition:border-color .3s,background .3s}
  .nav.scrolled{border-bottom-color:var(--line)}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;
    height:62px}
  .nav a{color:inherit;text-decoration:none}
  .nav-links{display:flex;gap:28px;font-size:13.5px;letter-spacing:-.005em;
    color:var(--mute)}
  .nav-links a{color:inherit}
  .nav-links a:hover{color:var(--ink)}
  .brand{font-family:var(--display);font-weight:500;font-size:15px;
    letter-spacing:-.01em;color:var(--ink)}
  .brand small{font-family:var(--mono);font-size:10px;color:var(--mute);
    margin-left:8px;letter-spacing:.04em;text-transform:uppercase;
    font-weight:400;vertical-align:middle}
  .nav-actions{display:flex;align-items:center;gap:12px}
  .theme-btn{display:inline-flex;align-items:center;gap:6px;height:30px;
    padding:0 12px;border:.5px solid var(--line);border-radius:999px;
    background:transparent;color:var(--mute);font-family:var(--mono);
    font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
    transition:color .2s,border-color .2s}
  .theme-btn:hover{color:var(--ink);border-color:var(--ink)}
  .theme-btn svg{width:12px;height:12px}

  /* sections */
  section{padding:clamp(80px,11vh,160px) 0;position:relative}
  section.tight{padding:clamp(48px,7vh,96px) 0}
  .sec-eyebrow{display:flex;align-items:center;gap:14px;margin-bottom:48px;
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--mute)}
  .sec-eyebrow .num{font-variant-numeric:tabular-nums}
  .sec-eyebrow .line{flex:1;height:1px;background:var(--line)}

  /* utility */
  .grid-12{display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
  @media (max-width:900px){
    .grid-12{grid-template-columns:repeat(6,1fr);gap:16px}
    .nav-links{display:none}
  }

  /* footer */
  footer{padding:60px 0 40px;border-top:.5px solid var(--line);
    color:var(--mute);font-size:13px}
  footer .row{display:flex;justify-content:space-between;align-items:baseline;
    gap:24px;flex-wrap:wrap}

  /* misc */
  button{font-family:inherit}
  input,textarea{font-family:inherit;color:inherit}
  /* big static word on archive */
  .arch-row{display:grid;grid-template-columns:60px 1fr 120px 180px 90px;
    gap:24px;align-items:center;padding:22px 0;border-top:.5px solid var(--line);
    transition:padding .35s ease}
  .arch-row:last-child{border-bottom:.5px solid var(--line)}
  .arch-row:hover{padding:26px 0}
  .arch-row .t{font-family:var(--display);font-size:clamp(22px,2.4vw,32px);
    font-weight:400;letter-spacing:-.02em;line-height:1.1}
  .arch-row .y{font-family:var(--mono);color:var(--mute);font-size:11px;
    letter-spacing:.04em;text-transform:uppercase;font-variant-numeric:tabular-nums}
  .arch-row .tag{font-family:var(--mono);color:var(--mute);font-size:11px;
    letter-spacing:.04em;text-transform:uppercase}
  .arch-row .role{font-family:var(--mono);color:var(--mute);font-size:11px;
    letter-spacing:.04em;text-transform:uppercase}
  .arch-row .arrow{justify-self:end;color:var(--mute);transition:transform .3s,color .3s}
  .arch-row:hover .arrow{transform:translateX(6px);color:var(--ink)}
  @media (max-width:900px){
    .arch-row{grid-template-columns:40px 1fr 60px;gap:14px}
    .arch-row .tag,.arch-row .role{display:none}
  }

  /* writing cards */
  .write-card{padding:32px 0;border-top:.5px solid var(--line);
    display:grid;grid-template-columns:140px 1fr 200px;gap:32px;align-items:start}
  .write-card:last-child{border-bottom:.5px solid var(--line)}
  .write-card .date{font-family:var(--mono);font-size:11px;letter-spacing:.04em;
    text-transform:uppercase;color:var(--mute);padding-top:6px}
  .write-card h3{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.2vw,30px);
    letter-spacing:-.02em;line-height:1.15;margin:0 0 10px}
  .write-card p{margin:0;color:var(--mute);font-size:15.5px;line-height:1.55;
    max-width:60ch}
  .write-card .meta{font-family:var(--mono);font-size:11px;letter-spacing:.04em;
    text-transform:uppercase;color:var(--mute);text-align:right;padding-top:6px}
  .write-card a{color:inherit;text-decoration:none}
  .write-card:hover h3{text-decoration:underline;text-decoration-thickness:.5px;
    text-underline-offset:6px}
  @media (max-width:900px){
    .write-card{grid-template-columns:1fr;gap:10px}
    .write-card .meta{text-align:left}
  }

  /* contact mailto huge */
  .mailto{display:block;font-family:var(--display);font-weight:400;
    font-size:clamp(40px,9vw,140px);letter-spacing:-.045em;line-height:.96;
    color:var(--ink);text-decoration:none;position:relative;
    padding:14px 0}
  .mailto .arrow{display:inline-block;transform:translateY(-.08em);
    transition:transform .5s cubic-bezier(.2,.7,.2,1)}
  .mailto:hover .arrow{transform:translate(.06em,-.14em)}

  /* skill grid */
  .skill-row{display:flex;justify-content:space-between;align-items:baseline;
    padding:14px 0;border-top:.5px solid var(--line);font-size:14px}
  .skill-row:last-child{border-bottom:.5px solid var(--line)}
  .skill-row .k{color:var(--mute);font-family:var(--mono);font-size:11px;
    letter-spacing:.04em;text-transform:uppercase}
  .skill-row .v{text-align:right;max-width:62%}

  /* About portrait */
  .portrait{aspect-ratio:4/5;background:var(--tile-2);position:relative;
    overflow:hidden;border:.5px solid var(--line);border-radius:6px}
  .portrait .stripes{position:absolute;inset:0;
    background-image:repeating-linear-gradient(45deg,transparent 0 11px,var(--line-soft) 11px 12px)}
  .portrait .tag{position:absolute;bottom:14px;left:16px;font-family:var(--mono);
    font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
  .portrait .tag-r{position:absolute;top:14px;right:16px;font-family:var(--mono);
    font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}

  /* magnetic */
  .mag{display:inline-block;transition:transform .25s cubic-bezier(.2,.7,.2,1)}

  /* responsive type override for narrow phones */
  @media (max-width:520px){
    .nav-inner{height:54px}
    .brand small{display:none}
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</head>
<body>
<div id="app"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="portfolio.jsx"></script>

</body>
</html>
